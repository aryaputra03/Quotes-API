# nginx/quotes-api.conf
# Reverse proxy Nginx di depan Express (Quotes API) — Fase 8.
# Di VPS: copy file ini ke /etc/nginx/sites-available/quotes-api.conf,
# lalu buat symlink:
#   sudo ln -s /etc/nginx/sites-available/quotes-api.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream quotes_api_upstream {
    # Kalau nanti scale ke beberapa proses Node (load balancing),
    # tinggal tambah baris "server 127.0.0.1:300x;" lain di sini.
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;

    # Ganti "_" dengan domain asli kalau sudah punya, misal: api.xxxx.com
    server_name _;

    client_max_body_size 1m;

    # Kompresi response JSON supaya lebih hemat bandwidth ke client
    gzip on;
    gzip_types application/json;
    gzip_min_length 512;

    access_log /var/log/nginx/quotes-api.access.log;
    error_log  /var/log/nginx/quotes-api.error.log;

    location / {
        proxy_pass http://quotes_api_upstream;
        proxy_http_version 1.1;

        # Catatan: header custom dari client (X-API-Key, X-Admin-Key)
        # DITERUSKAN APA ADANYA oleh proxy_pass (perilaku default Nginx),
        # jadi auth.middleware.js & adminAuth.middleware.js tetap bisa
        # membacanya tanpa konfigurasi tambahan apa pun di sini.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}